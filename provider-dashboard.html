<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provider Dashboard · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="profile.html">Profile</a>
            <a href="provider-dashboard.html">Dashboard</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="nav-actions" id="navAuth">
            <button class="btn-outline" onclick="openModal('signin')">Log In</button>
            <button class="btn-primary" onclick="openModal('signup')">Sign Up</button>
        </div>
    </nav>

    <h1 class="section-title" style="margin-top:40px;">Provider Dashboard</h1>
    <p class="section-sub">Manage your services, NID verification, and bookings</p>

    <!-- Statistics -->
    <div class="stats-row">
        <div class="stat-item"><div class="stat-number" id="totalServices">0</div><div class="stat-label">My Services</div></div>
        <div class="stat-item"><div class="stat-number" id="totalBookings">0</div><div class="stat-label">Total Bookings</div></div>
        <div class="stat-item"><div class="stat-number" id="pendingBookings">0</div><div class="stat-label">Pending</div></div>
        <div class="stat-item"><div class="stat-number" id="completedBookings">0</div><div class="stat-label">Completed</div></div>
    </div>

    <!-- My Services -->
    <section style="margin:40px 0;">
        <h2 class="section-title">My Services</h2>
        <div id="myServicesList"></div>
    </section>

    <!-- Booking Requests -->
    <section style="margin:40px 0;">
        <h2 class="section-title">Booking Requests</h2>
        <div id="providerBookingsList"></div>
    </section>

    <footer>
        <div>© 2026 FixMate · All rights reserved.</div>
        <div class="footer-links">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="logo-sm">Fix<span>Mate</span></div>
        <div class="subtitle" id="modalSubtitle">Sign in to your account</div>
        <div id="modalMessage" class="message-box"></div>
        <div class="tabs">
            <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
        </div>
        <form id="signinForm" class="form" onsubmit="handleSignIn(event)">
            <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required /></div>
            <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required /></div>
            <button type="submit" class="btn-full">Sign In</button>
        </form>
        <form id="signupForm" class="form hidden" onsubmit="handleSignUp(event)">
            <div class="form-group"><label>Full Name</label><input type="text" id="signupName" required /></div>
            <div class="form-group"><label>Email</label><input type="email" id="signupEmail" required /></div>
            <div class="form-group"><label>Password</label><input type="password" id="signupPassword" required /></div>
            <div class="form-group">
                <label>Register As</label>
                <select id="signupRole">
                    <option value="user">User (Book Services)</option>
                    <option value="provider">Provider (Offer Services)</option>
                </select>
            </div>
            <button type="submit" class="btn-full">Create Account</button>
        </form>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    async function loadProviderDashboard() {
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        if (!token || !userStr) {
            window.location.href = 'index.html';
            return;
        }

        try {
            // Statistics
            const statsRes = await fetch(`${API}/provider/statistics`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const statsData = await statsRes.json();

            if (statsData.success) {
                document.getElementById('totalServices').textContent = statsData.statistics.totalServices;
                document.getElementById('totalBookings').textContent = statsData.statistics.totalBookings;
                document.getElementById('pendingBookings').textContent = statsData.statistics.pendingBookings;
                document.getElementById('completedBookings').textContent = statsData.statistics.completedBookings;
            }

            // My Services
            const servicesRes = await fetch(`${API}/provider/my-services`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const servicesData = await servicesRes.json();

            const servicesList = document.getElementById('myServicesList');
            if (servicesData.success && servicesData.services.length > 0) {
                servicesList.innerHTML = servicesData.services.map(s => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <h3>${s.title}</h3>
                            <p><i class="fas fa-tag"></i> ৳${s.price}</p>
                            <p><i class="fas fa-map-marker-alt"></i> ${s.location || 'N/A'}</p>
                            <p><i class="fas fa-info-circle"></i> Status: ${s.status}</p>
                        </div>
                    </div>
                `).join('');
            } else {
                servicesList.innerHTML = '<p style="text-align:center;padding:40px;color:#98a2b3;">No services yet</p>';
            }

            // Bookings
            const bookingsRes = await fetch(`${API}/provider/bookings`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const bookingsData = await bookingsRes.json();

            const bookingsList = document.getElementById('providerBookingsList');
            if (bookingsData.success && bookingsData.bookings.length > 0) {
                bookingsList.innerHTML = bookingsData.bookings.map(b => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <h3>${b.serviceId?.title || 'Service'}</h3>
                            <p><i class="fas fa-user"></i> ${b.userId?.name || 'Customer'}</p>
                            <p><i class="fas fa-phone"></i> ${b.userId?.phone || 'N/A'}</p>
                            <p><i class="fas fa-calendar"></i> ${new Date(b.date).toLocaleDateString()} - ${b.time}</p>
                            <p><i class="fas fa-map-marker-alt"></i> ${b.address}</p>
                            <p class="price">৳${b.totalPrice}</p>
                        </div>
                        <div class="booking-status">
                            <span class="status-badge status-${b.status}">${b.status.toUpperCase()}</span>
                            ${b.status === 'pending' ? `
                                <button class="btn-primary" onclick="updateBookingStatus('${b._id}', 'accepted')" style="padding:8px 16px;font-size:0.85rem;">Accept</button>
                                <button class="btn-cancel" onclick="updateBookingStatus('${b._id}', 'rejected')">Reject</button>
                            ` : ''}
                            ${b.status === 'accepted' ? `
                                <button class="btn-primary" onclick="updateBookingStatus('${b._id}', 'completed')" style="padding:8px 16px;font-size:0.85rem;">Mark Complete</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } else {
                bookingsList.innerHTML = '<p style="text-align:center;padding:40px;color:#98a2b3;">No bookings yet</p>';
            }

        } catch (error) {
            console.log('Error:', error.message);
        }
    }

    async function updateBookingStatus(id, status) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API}/provider/bookings/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status })
            });
            const data = await res.json();
            if (data.success) {
                loadProviderDashboard();
            }
        } catch (error) {
            console.log('Error:', error.message);
        }
    }

    window.addEventListener('DOMContentLoaded', loadProviderDashboard);
</script>
</body>
</html>
