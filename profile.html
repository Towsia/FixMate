<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
    <nav class="navbar">
    <div class="logo">Fix<span>Mate</span></div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="my-bookings.html">My Bookings</a>
        <a href="profile.html">Profile</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>
    <div class="nav-actions">
        <button class="btn-outline" onclick="openModal('signin')">Log In</button>
        <button class="btn-primary" onclick="openModal('signup')">Sign Up</button>
    </div>
</nav>

    <h1 class="section-title" style="margin-top:40px;">My Profile</h1>
    <p class="section-sub">Manage your account information</p>

    <!-- Profile Picture -->
    <div class="profile-picture-section">
        <div class="profile-pic-container">
            <img id="profilePic" src="https://via.placeholder.com/150" alt="Profile" />
            <label for="profilePicInput" class="upload-btn">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="profilePicInput" accept="image/*" onchange="uploadProfilePic()" style="display:none;" />
        </div>
    </div>

    <!-- Profile Info -->
    <div class="profile-card">
        <h2>Personal Information</h2>
        <form id="profileForm" onsubmit="updateProfile(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="profileName" required />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="profileEmail" readonly style="background:#f1f4f9;" />
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="profilePhone" placeholder="01XXXXXXXXX" />
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="profileAddress" placeholder="Your address" />
            </div>
            <button type="submit" class="btn-full">Update Profile</button>
        </form>
    </div>

    <!-- Change Password -->
    <div class="profile-card" style="margin-top:24px;">
        <h2>Change Password</h2>
        <form id="passwordForm" onsubmit="changePassword(event)">
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" required />
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required />
            </div>
            <button type="submit" class="btn-full">Change Password</button>
        </form>
    </div>

    <div id="profileMessage" class="message-box" style="margin-top:16px;"></div>

    <footer>
        <div>© 2026 FixMate · All rights reserved.</div>
        <div class="footer-links">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="logo-sm">Fix<span>Mate</span></div>
        <div class="subtitle" id="modalSubtitle">Sign in to your account</div>
        <div id="modalMessage" class="message-box"></div>
        <div class="tabs">
            <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
        </div>
        <form id="signinForm" class="form" onsubmit="handleSignIn(event)">
            <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required /></div>
            <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required /></div>
            <button type="submit" class="btn-full">Sign In</button>
        </form>
        <form id="signupForm" class="form hidden" onsubmit="handleSignUp(event)">
            <div class="form-group"><label>Full Name</label><input type="text" id="signupName" required /></div>
            <div class="form-group"><label>Email</label><input type="email" id="signupEmail" required /></div>
            <div class="form-group"><label>Password</label><input type="password" id="signupPassword" required /></div>
            <button type="submit" class="btn-full">Create Account</button>
        </form>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    // Load Profile
    async function loadProfile() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'index.html';
            return;
        }

        try {
            const res = await fetch(`${API}/users/profile`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('profileName').value = data.user.name || '';
                document.getElementById('profileEmail').value = data.user.email || '';
                document.getElementById('profilePhone').value = data.user.phone || '';
                document.getElementById('profileAddress').value = data.user.address || '';
                if (data.user.profileImage) {
                    document.getElementById('profilePic').src = `${API.replace('/api', '')}/${data.user.profileImage}`;
                }
            }
        } catch (error) {
            console.log('Error loading profile:', error.message);
        }
    }

    // Update Profile
    async function updateProfile(e) {
        e.preventDefault();
        const token = localStorage.getItem('token');
        const name = document.getElementById('profileName').value;
        const phone = document.getElementById('profilePhone').value;
        const address = document.getElementById('profileAddress').value;

        try {
            const res = await fetch(`${API}/users/profile`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name, phone, address })
            });
            const data = await res.json();
            showProfileMessage(data.message, data.success ? 'success' : 'error');
        } catch (error) {
            showProfileMessage('Server error', 'error');
        }
    }

    // Change Password
    async function changePassword(e) {
        e.preventDefault();
        const token = localStorage.getItem('token');
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;

        try {
            const res = await fetch(`${API}/users/change-password`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ currentPassword, newPassword })
            });
            const data = await res.json();
            showProfileMessage(data.message, data.success ? 'success' : 'error');
            if (data.success) {
                document.getElementById('passwordForm').reset();
            }
        } catch (error) {
            showProfileMessage('Server error', 'error');
        }
    }

    // Upload Profile Picture
    async function uploadProfilePic() {
        const fileInput = document.getElementById('profilePicInput');
        const file = fileInput.files[0];
        if (!file) return;

        const token = localStorage.getItem('token');
        const formData = new FormData();
        formData.append('profileImage', file);

        try {
            const res = await fetch(`${API}/users/profile-picture`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('profilePic').src = `${API.replace('/api', '')}/${data.user.profileImage}`;
                showProfileMessage('Profile picture updated!', 'success');
            }
        } catch (error) {
            showProfileMessage('Error uploading picture', 'error');
        }
    }

    function showProfileMessage(text, type) {
        const box = document.getElementById('profileMessage');
        box.textContent = text;
        box.className = 'message-box ' + type;
        setTimeout(() => { box.className = 'message-box'; }, 3000);
    }

    window.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
