<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
    <nav class="navbar">
    <div class="logo">Fix<span>Mate</span></div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="my-bookings.html">My Bookings</a>
        <a href="profile.html">Profile</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>
    <div class="nav-actions">
        <button class="btn-outline" onclick="openModal('signin')">Log In</button>
        <button class="btn-primary" onclick="openModal('signup')">Sign Up</button>
    </div>
</nav>

    <h1 class="section-title" style="margin-top:40px;">Contact Us</h1>
    <p class="section-sub">Get in touch with us for any queries</p>

    <div class="contact-grid">
        <div class="contact-card">
            <i class="fas fa-phone"></i>
            <h3>Phone</h3>
            <p>+880 1234-567890</p>
        </div>
        <div class="contact-card">
            <i class="fas fa-envelope"></i>
            <h3>Email</h3>
            <p>support@fixmate.com</p>
        </div>
        <div class="contact-card">
            <i class="fas fa-map-marker-alt"></i>
            <h3>Address</h3>
            <p>Chattogram, Bangladesh</p>
        </div>
    </div>

    <!-- ===== Google Map  ===== -->
    <div class="map-container">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d118147.52847526949!2d91.74502905!3d22.356851!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30acd8a64095ce53%3A0xb4c4c4c4c4c4c4c4!2sChattogram!5e0!3m2!1sen!2sbd!4v1234567890"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

    <footer>
        <div>© 2026 FixMate · All rights reserved.</div>
        <div class="footer-links">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>
</div>

<!-- ===== AUTH MODAL ===== -->
<div class="modal-overlay" id="authModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="logo-sm">Fix<span>Mate</span></div>
        <div class="subtitle">Sign in to your account</div>
        <div id="modalMessage" class="message-box"></div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <form id="signinForm" class="form" onsubmit="handleSignIn(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-full">Sign In</button>
        </form>

        <form id="signupForm" class="form hidden" onsubmit="handleSignUp(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Towsia Masnun" required />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-full">Create Account</button>
        </form>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
