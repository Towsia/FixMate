<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links" id="navLinks"></div>
        <div class="nav-actions" id="navAuth"></div>
    </nav>

    <div style="margin-top: 40px;">
        <h1 class="section-title">Admin Dashboard</h1>
        <p class="section-sub">Manage users and services</p>

        <div class="admin-tabs">
            <button class="admin-tab active" onclick="showTab('users', this)">All Users</button>
            <button class="admin-tab" onclick="showTab('services', this)">Manage Services</button>
        </div>

        <div id="usersTab" class="admin-content"></div>
        <div id="servicesTab" class="admin-content hidden"></div>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    let allData = { users: [], verifiedProviders: [], pendingProviders: [], services: [], bookings: [] };

    async function fetchAdminData() {
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; return; }
        try {
            const res = await fetch(`${API}/admin/details`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) {
                allData = data;
                renderUsersTab();
                renderServicesTab();
            }
        } catch (error) { console.error('Error:', error); }
    }

    function renderUsersTab() {
        const list = document.getElementById('usersTab');
        if (allData.users.length === 0) { list.innerHTML = '<p>No users found</p>'; return; }
        list.innerHTML = allData.users.map(u => `
            <div class="booking-item" style="display:flex; justify-content:space-between; align-items:center;">
                <div><h3>${u.name}</h3><p><i class="fas fa-envelope"></i> ${u.email}</p></div>
                <button class="btn-cancel" onclick="deleteUser('${u._id}')">Delete</button>
            </div>
        `).join('');
    }

    function renderServicesTab() {
        const list = document.getElementById('servicesTab');
        let html = `
            <div style="background:#f9fafb; padding:20px; border-radius:12px; margin-bottom:30px;">
                <h3 style="margin-bottom:15px;">Add New Service</h3>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <input type="text" id="newSrvTitle" placeholder="Service Title" style="padding:10px; border-radius:8px; border:1px solid #ccc; flex:1;">
                    <input type="number" id="newSrvPrice" placeholder="Price (৳)" style="padding:10px; border-radius:8px; border:1px solid #ccc; flex:1;">
                    <input type="text" id="newSrvCategory" placeholder="Category ID" style="padding:10px; border-radius:8px; border:1px solid #ccc; flex:1;">
                    <button class="btn-primary" onclick="addService()" style="padding:10px 20px;">Add Service</button>
                </div>
            </div>
        `;
        if (allData.services.length === 0) { html += '<p>No services found</p>'; }
        else {
            html += allData.services.map(s => `
                <div class="booking-item" style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <h3>${s.title}</h3>
                        <p>Price: ৳${s.price}</p>
                        <p>Provider: ${s.providerId?.name || 'N/A'}</p>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-primary" onclick="editService('${s._id}', ${s.price})" style="padding:8px 12px; font-size:0.85rem;">Edit Price</button>
                        <button class="btn-cancel" onclick="deleteService('${s._id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        list.innerHTML = html;
    }

    async function addService() {
        const title = document.getElementById('newSrvTitle').value;
        const price = document.getElementById('newSrvPrice').value;
        const categoryId = document.getElementById('newSrvCategory').value;
        if (!title || !price || !categoryId) { alert('Please fill all fields'); return; }
        const token = localStorage.getItem('token');
        const res = await fetch(`${API}/services`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ title, price, categoryId, description: 'Admin added service', location: 'Chattogram' })
        });
        if (res.ok) { alert('Service Added!'); location.reload(); }
        else { alert('Failed to add service'); }
    }

    async function editService(id, oldPrice) {
        const newPrice = prompt('Enter new price:', oldPrice);
        if (!newPrice) return;
        const token = localStorage.getItem('token');
        const res = await fetch(`${API}/services/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ price: newPrice })
        });
        if (res.ok) { alert('Price Updated!'); location.reload(); }
    }

    async function deleteService(id) {
        if (!confirm('Delete this service?')) return;
        const token = localStorage.getItem('token');
        const res = await fetch(`${API}/services/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) { alert('Service Deleted!'); location.reload(); }
    }

    async function deleteUser(id) {
        if (!confirm('Delete this user?')) return;
        const token = localStorage.getItem('token');
        await fetch(`${API}/admin/users/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        location.reload();
    }

    function showTab(tab, btn) {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-content').forEach(c => c.classList.add('hidden'));
        btn.classList.add('active');
        document.getElementById(`${tab}Tab`).classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', fetchAdminData);
</script>
</body>
</html>
