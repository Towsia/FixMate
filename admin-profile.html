<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Profile · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="admin.html">Admin Panel</a>
        </div>
        <div class="nav-actions">
            <button class="btn-outline btn-logout" onclick="logout()">Log Out</button>
        </div>
    </nav>

    <h1 class="section-title" style="margin-top:40px;">Admin Profile</h1>
    <p class="section-sub">Your account information</p>

    <div class="profile-card" style="max-width:500px;">
        <div style="text-align:center; margin-bottom:20px;">
            <i class="fas fa-user-shield" style="font-size:4rem; color:#2a7de1;"></i>
        </div>
        <h2 id="adminName" style="text-align:center;">Loading...</h2>
        <p style="text-align:center; color:#667185;" id="adminEmail"></p>
        <p style="text-align:center; color:#667185;" id="adminRole"></p>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const userStr = localStorage.getItem('user');
        if (userStr) {
            const user = JSON.parse(userStr);
            document.getElementById('adminName').textContent = user.name;
            document.getElementById('adminEmail').textContent = user.email;
            document.getElementById('adminRole').textContent = 'Role: Admin';
        } else {
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
