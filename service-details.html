<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Details · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .service-details-container {
            display: flex;
            gap: 40px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        .service-main {
            flex: 1 1 600px;
        }
        .service-sidebar {
            flex: 1 1 350px;
            background: white;
            padding: 32px;
            border-radius: 24px;
            border: 1px solid #eaecf0;
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        .service-cover {
            width: 100%;
            height: 400px;
            border-radius: 24px;
            object-fit: cover;
            margin-bottom: 24px;
        }
        .service-title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #0b1a33;
            margin-bottom: 16px;
        }
        .service-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            color: #475467;
            align-items: center;
        }
        .service-meta .badge {
            background: #eef4ff;
            color: #1f4f8a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .service-description {
            font-size: 1.1rem;
            color: #475467;
            line-height: 1.7;
            margin-bottom: 40px;
        }
        .provider-info {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #eaecf0;
        }
        .provider-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #eef4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #2a7de1;
        }
        .provider-details h4 {
            font-size: 1.1rem;
            color: #0b1a33;
        }
        .provider-details p {
            color: #667185;
            font-size: 0.9rem;
        }
        .price-big {
            font-size: 2.2rem;
            font-weight: 800;
            color: #2a7de1;
            margin-bottom: 24px;
        }
        .reviews-section {
            margin-top: 48px;
        }
        .review-summary {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
            padding: 24px;
            background: #f7f9fd;
            border-radius: 16px;
        }
        .rating-big {
            font-size: 3rem;
            font-weight: 800;
            color: #0b1a33;
        }
        .rating-stars {
            color: #f5b342;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .review-item {
            padding-bottom: 24px;
            border-bottom: 1px solid #eaecf0;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .reviewer-name {
            font-weight: 600;
            color: #0b1a33;
        }
        .review-date {
            color: #98a2b3;
            font-size: 0.9rem;
        }
        .review-stars {
            color: #f5b342;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .review-comment {
            color: #475467;
            line-height: 1.6;
        }
        .review-form-container {
            margin-top: 40px;
            padding: 24px;
            background: white;
            border: 1px solid #eaecf0;
            border-radius: 16px;
        }
        .star-input {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 1.5rem;
            color: #d0d5dd;
            cursor: pointer;
        }
        .star-input i:hover, .star-input i.active {
            color: #f5b342;
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="my-bookings.html">My Bookings</a>
            <a href="profile.html">Profile</a>
            <a href="provider-dashboard.html">Dashboard</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="nav-actions">
            <button class="btn-outline" onclick="openModal('signin')">Log In</button>
            <button class="btn-primary" onclick="openModal('signup')">Sign Up</button>
        </div>
    </nav>

    <div id="serviceDetailsContainer">
        <p style="text-align:center;padding:60px;color:#98a2b3;">Loading service details...</p>
    </div>

    <footer>
        <div>© 2026 FixMate · All rights reserved.</div>
        <div class="footer-links">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>
</div>

<!-- ============================================= -->
<!-- ===== AUTH MODAL ===== -->
<!-- ============================================= -->
<div class="modal-overlay" id="authModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="logo-sm">Fix<span>Mate</span></div>
        <div class="subtitle" id="modalSubtitle">Sign in to your account</div>
        <div id="modalMessage" class="message-box"></div>
        <div class="tabs">
            <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
        </div>
        <form id="signinForm" class="form" onsubmit="handleSignIn(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-full">Sign In</button>
            <div class="switch-text">
                Don't have an account? <a onclick="switchTab('signup')">Sign Up</a>
            </div>
        </form>
        <form id="signupForm" class="form hidden" onsubmit="handleSignUp(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Towsia Masnun" required />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-full">Create Account</button>
            <div class="switch-text">
                Already have an account? <a onclick="switchTab('signin')">Sign In</a>
            </div>
        </form>
    </div>
</div>

<!-- ============================================= -->
<!-- ===== BOOKING MODAL ===== -->
<!-- ============================================= -->
<div class="modal-overlay" id="bookingModal">
    <div class="modal">
        <button class="modal-close" onclick="closeBookingModal()">&times;</button>
        <div class="logo-sm">Book <span>Service</span></div>
        <div class="subtitle">Fill in your booking details</div>
        <div id="bookingMessage" class="message-box"></div>
        <form onsubmit="submitBooking(event)">
            <input type="hidden" id="bookingServiceId" />
            <div class="form-group">
                <label>Service</label>
                <input type="text" id="bookingServiceName" readonly style="background:#f1f4f9;" />
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="bookingDate" required />
            </div>
            <div class="form-group">
                <label>Time</label>
                <input type="time" id="bookingTime" required />
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="bookingAddress" placeholder="Your full address" required />
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="bookingPhone" placeholder="01XXXXXXXXX" required />
            </div>
            <div class="form-group">
                <label>Notes (Optional)</label>
                <input type="text" id="bookingNotes" placeholder="Any special request" />
            </div>
            <button type="submit" class="btn-full">Confirm Booking</button>
        </form>
    </div>
</div>

<!-- ============================================= -->
<!-- ===== JAVASCRIPT ===== -->
<!-- ============================================= -->
<script src="js/main.js"></script>
<script>
    const serviceImages = {
        "Home Cleaning": "https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=800&h=400&fit=crop",
        "Electrician Service": "https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=800&h=400&fit=crop",
        "Plumber Service": "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800&h=400&fit=crop",
        "Painting Service": "https://images.unsplash.com/photo-1562259949-e8e7689d7828?w=800&h=400&fit=crop",
        "Gardening Service": "https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=800&h=400&fit=crop",
        "Handyman Service": "https://images.unsplash.com/photo-1504148455328-c376907d081c?w=800&h=400&fit=crop",
        "AC Repair Service": "https://images.unsplash.com/photo-1621905252507-b35492cc74b4?w=800&h=400&fit=crop",
        "Refrigerator Repair": "https://images.unsplash.com/photo-1584568694244-14fbdf83bd30?w=800&h=400&fit=crop",
        "Washing Machine Repair": "https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=800&h=400&fit=crop",
        "TV Repair Service": "https://images.unsplash.com/photo-1593784991095-a205069470b6?w=800&h=400&fit=crop",
        "Computer Repair": "https://images.unsplash.com/photo-1588702547919-26089e690ecc?w=800&h=400&fit=crop",
        "Sofa Cleaning": "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&h=400&fit=crop",
        "Carpet Cleaning": "https://images.unsplash.com/photo-1600585152220-90363fe7e115?w=800&h=400&fit=crop",
        "Pest Control": "https://images.unsplash.com/photo-1585687341511-ec5f6d5b3e3d?w=800&h=400&fit=crop",
        "Water Tank Cleaning": "https://images.unsplash.com/photo-1585704032915-c3400ca199e7?w=800&h=400&fit=crop",
        "CCTV Installation": "https://images.unsplash.com/photo-1557597774-9d273605dfa9?w=800&h=400&fit=crop",
        "Interior Design": "https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=800&h=400&fit=crop",
        "Furniture Assembly": "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&h=400&fit=crop",
        "Moving Service": "https://images.unsplash.com/photo-1600518464441-9154a4dea21b?w=800&h=400&fit=crop",
        "Roof Repair": "https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=800&h=400&fit=crop",
        "Window Cleaning": "https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=800&h=400&fit=crop",
        "Solar Panel Installation": "https://images.unsplash.com/photo-1509391366360-2e959784a276?w=800&h=400&fit=crop",
        "Generator Repair": "https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=800&h=400&fit=crop",
        "Water Purifier Service": "https://images.unsplash.com/photo-1585704032915-c3400ca199e7?w=800&h=400&fit=crop"
    };
    
    let currentService = null;
    let selectedRating = 5;
    let eligibleBookingId = null;

    async function loadServiceDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const serviceId = urlParams.get('id');

        if (!serviceId) {
            document.getElementById('serviceDetailsContainer').innerHTML = '<p style="text-align:center;color:#b42318;padding:40px;">Invalid Service ID.</p>';
            return;
        }

        try {
            // Load Service Details
            const res = await fetch(`${API}/services/${serviceId}`);
            const data = await res.json();
            
            if (!data.success) {
                document.getElementById('serviceDetailsContainer').innerHTML = '<p style="text-align:center;color:#b42318;padding:40px;">Service not found.</p>';
                return;
            }

            currentService = data.service;
            const imgUrl = serviceImages[currentService.title] || "https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=800&h=400&fit=crop";
            const catName = currentService.categoryId?.name || 'Others';

            // Check Booking Eligibility for Review
            const token = localStorage.getItem('token');
            let canReview = false;
            
            if (token) {
                const bRes = await fetch(`${API}/bookings/my-bookings`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const bData = await bRes.json();
                if (bData.success) {
                    const completedBooking = bData.bookings.find(b => 
                        (b.serviceId?._id === serviceId || b.serviceId === serviceId) && b.status === 'completed'
                    );
                    if (completedBooking) {
                        canReview = true;
                        eligibleBookingId = completedBooking._id;
                    }
                }
            }

            // Load Reviews
            const rRes = await fetch(`${API}/reviews/service/${serviceId}`);
            const rData = await rRes.json();
            const reviews = rData.success ? rData.reviews : [];
            
            const avgRating = reviews.length ? (reviews.reduce((acc, r) => acc + r.rating, 0) / reviews.length).toFixed(1) : '0.0';
            
            const starsHtml = (rating) => {
                let html = '';
                for (let i = 1; i <= 5; i++) {
                    html += `<i class="fa${i <= rating ? 's' : 'r'} fa-star"></i>`;
                }
                return html;
            };

            const reviewsListHtml = reviews.length ? reviews.map(r => `
                <div class="review-item">
                    <div class="review-header">
                        <div class="reviewer-name">${r.userId?.name || 'User'}</div>
                        <div class="review-date">${new Date(r.createdAt).toLocaleDateString()}</div>
                    </div>
                    <div class="review-stars">${starsHtml(r.rating)}</div>
                    <div class="review-comment">${r.comment || ''}</div>
                </div>
            `).join('') : '<p style="color:#98a2b3;">No reviews yet. Be the first to review!</p>';

            const reviewFormHtml = canReview ? `
                <div class="review-form-container">
                    <h3>Leave a Review</h3>
                    <div id="reviewMessage" class="message-box"></div>
                    <form onsubmit="submitReview(event)" style="margin-top:16px;">
                        <div class="form-group">
                            <label>Rating</label>
                            <div class="star-input" id="starInput">
                                <i class="fas fa-star active" data-val="1"></i>
                                <i class="fas fa-star active" data-val="2"></i>
                                <i class="fas fa-star active" data-val="3"></i>
                                <i class="fas fa-star active" data-val="4"></i>
                                <i class="fas fa-star active" data-val="5"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Comment</label>
                            <textarea id="reviewComment" rows="4" placeholder="Share your experience..."></textarea>
                        </div>
                        <button type="submit" class="btn-primary">Submit Review</button>
                    </form>
                </div>
            ` : '';

            document.getElementById('serviceDetailsContainer').innerHTML = `
                <div class="service-details-container">
                    <div class="service-main">
                        <img src="${imgUrl}" alt="${currentService.title}" class="service-cover" onerror="this.src='https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=800&h=400&fit=crop'" />
                        <h1 class="service-title">${currentService.title}</h1>
                        <div class="service-meta">
                            <span class="badge"><i class="fas fa-tag"></i> ${catName}</span>
                            <span><i class="fas fa-map-marker-alt" style="color:#2a7de1;"></i> ${currentService.location || 'Chattogram'}</span>
                            <span><i class="fas fa-star" style="color:#f5b342;"></i> ${avgRating} (${reviews.length} reviews)</span>
                        </div>
                        <div class="service-description">
                            ${currentService.description}
                        </div>
                        
                        <div class="reviews-section">
                            <h2 class="section-title">Reviews</h2>
                            <div class="review-summary">
                                <div class="rating-big">${avgRating}</div>
                                <div>
                                    <div class="rating-stars">${starsHtml(Math.round(avgRating))}</div>
                                    <div style="color:#667185;">Based on ${reviews.length} reviews</div>
                                </div>
                            </div>
                            <div class="review-list">
                                ${reviewsListHtml}
                            </div>
                            ${reviewFormHtml}
                        </div>
                    </div>
                    
                    <div class="service-sidebar">
                        <div class="provider-info">
                            <div class="provider-avatar">
                                <i class="fas fa-user-tie"></i>
                            </div>
                            <div class="provider-details">
                                <h4>${currentService.providerId?.name || 'FixMate Professional'}</h4>
                                <p>Verified Provider <i class="fas fa-check-circle" style="color:#067647;"></i></p>
                            </div>
                        </div>
                        <div class="price-big">৳${currentService.price}</div>
                        <p style="margin-bottom:24px;color:#475467;"><i class="fas fa-info-circle"></i> ${currentService.status === 'active' ? 'Available for booking' : 'Currently unavailable'}</p>
                        ${currentService.status === 'active' 
                            ? `<button class="btn-full" onclick="bookService('${currentService._id}', '${currentService.title.replace(/'/g, "\\'")}')" style="margin:0;"><i class="fas fa-calendar-check"></i> Book Now</button>`
                            : `<button class="btn-full" style="margin:0;background:#d0d5dd;cursor:not-allowed;" disabled>Unavailable</button>`}
                    </div>
                </div>
            `;
            
            if (canReview) {
                setupStarInput();
            }

        } catch (error) {
            console.error(error);
            document.getElementById('serviceDetailsContainer').innerHTML = '<p style="text-align:center;color:#b42318;padding:40px;">Error loading service details.</p>';
        }
    }
    
    function setupStarInput() {
        const stars = document.querySelectorAll('#starInput i');
        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                selectedRating = parseInt(e.target.getAttribute('data-val'));
                stars.forEach((s, idx) => {
                    if (idx < selectedRating) {
                        s.classList.add('active');
                        s.classList.replace('far', 'fas');
                    } else {
                        s.classList.remove('active');
                        s.classList.replace('fas', 'far');
                    }
                });
            });
        });
    }

    async function submitReview(e) {
        e.preventDefault();
        const token = localStorage.getItem('token');
        const comment = document.getElementById('reviewComment').value;
        const msgBox = document.getElementById('reviewMessage');

        try {
            const res = await fetch(`${API}/reviews`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ 
                    bookingId: eligibleBookingId, 
                    serviceId: currentService._id, 
                    providerId: currentService.providerId?._id || currentService.providerId, 
                    rating: selectedRating, 
                    comment 
                })
            });
            const data = await res.json();

            if (data.success || res.status === 201) {
                msgBox.textContent = '✅ Review submitted successfully!';
                msgBox.className = 'message-box success';
                setTimeout(() => window.location.reload(), 1500);
            } else if (res.status === 409 || data.message?.toLowerCase().includes('already reviewed')) {
                msgBox.textContent = 'You have already reviewed this booking.';
                msgBox.className = 'message-box error';
            } else {
                msgBox.textContent = '❌ ' + (data.message || 'Error submitting review');
                msgBox.className = 'message-box error';
            }
        } catch (error) {
            msgBox.textContent = '❌ Server error.';
            msgBox.className = 'message-box error';
        }
    }

    function bookService(id, name) {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Please login first to book this service.');
            openModal('signin');
            return;
        }
        document.getElementById('bookingServiceId').value = id;
        document.getElementById('bookingServiceName').value = name;
        document.getElementById('bookingModal').classList.add('active');
    }

    function closeBookingModal() {
        document.getElementById('bookingModal').classList.remove('active');
    }

    async function submitBooking(e) {
        e.preventDefault();
        const token = localStorage.getItem('token');
        const serviceId = document.getElementById('bookingServiceId').value;
        const date = document.getElementById('bookingDate').value;
        const time = document.getElementById('bookingTime').value;
        const address = document.getElementById('bookingAddress').value;
        const phone = document.getElementById('bookingPhone').value;
        const notes = document.getElementById('bookingNotes').value;

        const msgBox = document.getElementById('bookingMessage');

        try {
            const res = await fetch(`${API}/bookings`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ serviceId, date, time, address, phone, notes })
            });
            const data = await res.json();

            if (data.success) {
                msgBox.textContent = '✅ Booking created successfully!';
                msgBox.className = 'message-box success';
                setTimeout(() => {
                    closeBookingModal();
                    window.location.href = 'my-bookings.html';
                }, 1500);
            } else {
                msgBox.textContent = '❌ ' + data.message;
                msgBox.className = 'message-box error';
            }
        } catch (error) {
            msgBox.textContent = '❌ Server error. Make sure backend is running.';
            msgBox.className = 'message-box error';
        }
    }

    document.getElementById('bookingModal').addEventListener('click', function(e) {
        if (e.target === this) closeBookingModal();
    });

    window.addEventListener('DOMContentLoaded', loadServiceDetails);
</script>
</body>
</html>
