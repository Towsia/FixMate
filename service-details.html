<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Details · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#services">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="nav-actions">
            <button class="btn-outline" onclick="openModal('signin')">Log In</button>
            <button class="btn-primary" onclick="openModal('signup')">Sign Up</button>
        </div>
    </nav>

    <div class="details-container" id="detailsContainer">
        <p style="text-align:center;width:100%;padding:60px;color:#98a2b3;">Loading service details...</p>
    </div>

    <footer>
        <div>© 2026 FixMate · All rights reserved.</div>
        <div class="footer-links">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>
</div>

<!-- AUTH MODAL (Same as index.html) -->
<div class="modal-overlay" id="authModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="logo-sm">Fix<span>Mate</span></div>
        <div class="subtitle" id="modalSubtitle">Sign in to your account</div>
        <div id="modalMessage" class="message-box"></div>

        <div class="tabs">
            <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <form id="signinForm" class="form" onsubmit="handleSignIn(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-full">Sign In</button>
        </form>

        <form id="signupForm" class="form hidden" onsubmit="handleSignUp(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Towsia Masnun" required />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-full">Create Account</button>
        </form>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    const API = 'http://localhost:5000/api';

    // Get service ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const serviceId = urlParams.get('id');

    async function loadServiceDetails() {
        if (!serviceId) {
            document.getElementById('detailsContainer').innerHTML = '<p style="text-align:center;width:100%;padding:60px;color:#b42318;">Service ID not found.</p>';
            return;
        }

        try {
            const res = await fetch(`${API}/services/${serviceId}`);
            const data = await res.json();

            if (data.success) {
                const s = data.service;
                document.getElementById('detailsContainer').innerHTML = `
                    <div class="details-image">
                        <i class="fas fa-tools"></i>
                    </div>
                    <div class="details-info">
                        <h1>${s.title}</h1>
                        <div class="price">৳${s.price}</div>
                        <p class="description">${s.description}</p>
                        <div class="meta">
                            <div><i class="fas fa-map-marker-alt"></i> ${s.location || 'N/A'}</div>
                            <div><i class="fas fa-user"></i> ${s.providerId?.name || 'Provider'}</div>
                            <div><i class="fas fa-star"></i> ${s.averageRating || 0} / 5</div>
                            <div><i class="fas fa-check-circle"></i> ${s.status}</div>
                        </div>
                        <button class="btn-book" onclick="bookService('${s._id}')">
                            <i class="fas fa-calendar-check"></i> Book Now
                        </button>
                    </div>
                `;
            } else {
                document.getElementById('detailsContainer').innerHTML = '<p style="text-align:center;width:100%;padding:60px;color:#b42318;">Service not found.</p>';
            }
        } catch (error) {
            document.getElementById('detailsContainer').innerHTML = '<p style="text-align:center;width:100%;padding:60px;color:#b42318;">Error loading service.</p>';
        }
    }

    function bookService(id) {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Please login first to book this service.');
            openModal('signin');
            return;
        }
        alert('Booking feature coming in Week 5!');
    }

    window.addEventListener('DOMContentLoaded', loadServiceDetails);
</script>
</body>
</html>
