<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="my-bookings.html">My Bookings</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="nav-actions">
            <button class="btn-outline" onclick="openModal('signin')">Log In</button>
            <button class="btn-primary" onclick="openModal('signup')">Sign Up</button>
        </div>
    </nav>

    <!-- ===== MY BOOKINGS ===== -->
    <h1 class="section-title" style="margin-top:40px;">My Bookings</h1>
    <p class="section-sub">All your service bookings in one place</p>

    <div id="bookingsContainer">
        <p style="text-align:center;padding:60px;color:#98a2b3;">Loading bookings...</p>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div>© 2026 FixMate · All rights reserved.</div>
        <div class="footer-links">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>
</div>

<!-- ============================================= -->
<!-- ===== AUTH MODAL ===== -->
<!-- ============================================= -->
<div class="modal-overlay" id="authModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="logo-sm">Fix<span>Mate</span></div>
        <div class="subtitle" id="modalSubtitle">Sign in to your account</div>
        <div id="modalMessage" class="message-box"></div>
        <div class="tabs">
            <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
        </div>
        <form id="signinForm" class="form" onsubmit="handleSignIn(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-full">Sign In</button>
            <div class="switch-text">
                Don't have an account? <a onclick="switchTab('signup')">Sign Up</a>
            </div>
        </form>
        <form id="signupForm" class="form hidden" onsubmit="handleSignUp(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Towsia Masnun" required />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-full">Create Account</button>
            <div class="switch-text">
                Already have an account? <a onclick="switchTab('signin')">Sign In</a>
            </div>
        </form>
    </div>
</div>

<!-- ============================================= -->
<!-- ===== JAVASCRIPT ===== -->
<!-- ============================================= -->
<script src="js/main.js"></script>
<script>
    
    const API = 'https://fixmate-backend-jhlp.onrender.com/api';

    // ===== Load My Bookings =====
    async function loadMyBookings() {
        const token = localStorage.getItem('token');
        if (!token) {
            document.getElementById('bookingsContainer').innerHTML = `
                <div style="text-align:center;padding:60px;">
                    <i class="fas fa-lock" style="font-size:3rem;color:#98a2b3;margin-bottom:16px;"></i>
                    <p style="color:#475467;margin-bottom:20px;">Please login to see your bookings</p>
                    <button class="btn-primary" onclick="openModal('signin')">Login Now</button>
                </div>
            `;
            return;
        }

        try {
            const res = await fetch(`${API}/bookings/my-bookings`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();

            const container = document.getElementById('bookingsContainer');

            if (data.success && data.bookings.length > 0) {
                container.innerHTML = data.bookings.map(b => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <h3>${b.serviceId?.title || 'Service'}</h3>
                            <p><i class="fas fa-calendar"></i> ${new Date(b.date).toLocaleDateString()}</p>
                            <p><i class="fas fa-clock"></i> ${b.time}</p>
                            <p><i class="fas fa-map-marker-alt"></i> ${b.address}</p>
                            <p class="price">৳${b.totalPrice}</p>
                        </div>
                        <div class="booking-status">
                            <span class="status-badge status-${b.status}">${b.status.toUpperCase()}</span>
                            ${b.status === 'pending' ? `<button class="btn-cancel" onclick="cancelBooking('${b._id}')">Cancel</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `
                    <div style="text-align:center;padding:60px;">
                        <i class="fas fa-calendar-times" style="font-size:3rem;color:#98a2b3;margin-bottom:16px;"></i>
                        <p style="color:#475467;">No bookings yet</p>
                        <a href="services.html" class="btn-primary" style="text-decoration:none;display:inline-block;margin-top:16px;padding:12px 28px;">Browse Services</a>
                    </div>
                `;
            }
        } catch (error) {
            document.getElementById('bookingsContainer').innerHTML = `
                <p style="text-align:center;color:#b42318;padding:40px;">Error loading bookings.</p>
            `;
        }
    }

    // ===== Cancel Booking =====
    async function cancelBooking(id) {
        if (!confirm('Are you sure you want to cancel this booking?')) return;

        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API}/bookings/${id}/cancel`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();

            if (data.success) {
                alert('Booking cancelled successfully');
                loadMyBookings();
            } else {
                alert('Error: ' + data.message);
            }
        } catch (error) {
            alert('Error cancelling booking');
        }
    }

    // Load on Page Start
    window.addEventListener('DOMContentLoaded', loadMyBookings);
</script>
</body>
</html>
