<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links" id="navLinks">
            <!-- Admin Navbar links -->
        </div>
        <div class="nav-actions" id="navAuth">
            <!-- Admin Auth Actions & Dropdown -->
        </div>
    </nav>

    <h1 class="section-title" style="margin-top:40px;">Admin Dashboard</h1>
    <p class="section-sub">Manage Users, Services, and NID Verification</p>

    <!-- Tabs -->
    <div class="admin-tabs" id="adminTabs">
        <button class="admin-tab active" id="tabUsersBtn" onclick="showTab('users', this)">All Users</button>
        <button class="admin-tab" id="tabServicesBtn" onclick="showTab('services', this)">All Services</button>
        <button class="admin-tab" id="tabNidBtn" onclick="showTab('nid', this)">NID Verify</button>
    </div>

    <!-- Users Tab -->
    <div id="usersTab" class="admin-content">
        <div id="usersList"></div>
    </div>

    <!-- Services Tab -->
    <div id="servicesTab" class="admin-content hidden">
        <div id="servicesList"></div>
    </div>

    <!-- NID Tab -->
    <div id="nidTab" class="admin-content hidden">
        <div id="nidList"></div>
    </div>

    <!-- User Details Section (Dropdown theke ashbe) -->
    <div id="detailedUserSection" class="admin-content hidden">
        <h2 class="section-title">Detailed User Information</h2>
        <div id="detailedUserList"></div>
    </div>

    <!-- Provider Details Section (Dropdown theke ashbe) -->
    <div id="detailedProviderSection" class="admin-content hidden">
        <h2 class="section-title">Detailed Provider Information</h2>
        <div id="detailedProviderList"></div>
    </div>

</div>

<script src="js/main.js"></script>
<script>
    // Load Admin Dashboard Data
    async function loadAdminDashboard() {
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; return; }

        try {
            // Load Users
            const usersRes = await fetch(`${API}/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            const usersData = await usersRes.json();
            const usersList = document.getElementById('usersList');
            if (usersData.success && usersData.users.length > 0) {
                usersList.innerHTML = usersData.users.map(u => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <h3>${u.name}</h3>
                            <p><i class="fas fa-envelope"></i> ${u.email}</p>
                            <p><i class="fas fa-user-tag"></i> ${u.role.toUpperCase()}</p>
                        </div>
                        <div class="booking-status">
                            <button class="btn-cancel" onclick="deleteUser('${u._id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } else { usersList.innerHTML = '<p style="text-align:center;padding:40px;">No users found</p>'; }

            // Load Services
            const servicesRes = await fetch(`${API}/admin/services`, { headers: { 'Authorization': `Bearer ${token}` } });
            const servicesData = await servicesRes.json();
            const servicesList = document.getElementById('servicesList');
            if (servicesData.success && servicesData.services.length > 0) {
                servicesList.innerHTML = servicesData.services.map(s => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <h3>${s.title}</h3>
                            <p><i class="fas fa-tag"></i> ৳${s.price}</p>
                            <p><i class="fas fa-user"></i> ${s.providerId?.name || 'N/A'}</p>
                        </div>
                    </div>
                `).join('');
            } else { servicesList.innerHTML = '<p style="text-align:center;padding:40px;">No services found</p>'; }

            // Load NID
            const nidRes = await fetch(`${API}/admin/nid-list`, { headers: { 'Authorization': `Bearer ${token}` } });
            const nidData = await nidRes.json();
            const nidList = document.getElementById('nidList');
            if (nidData.success && nidData.users.length > 0) {
                nidList.innerHTML = nidData.users.map(u => `
                    <div class="booking-item" style="flex-direction:column; align-items:stretch; padding:24px;">
                        <h3>${u.name}</h3>
                        <p><i class="fas fa-id-card"></i> NID: ${u.nidNumber || 'Not Submitted'}</p>
                        <p>Status: <span style="color:${u.nidStatus === 'verified' ? '#067647' : '#92400e'}; font-weight:600;">${(u.nidStatus || 'not_submitted').toUpperCase()}</span></p>
                        <div style="display:flex; gap:12px; margin-top:12px;">
                            ${u.nidStatus === 'pending' ? `
                                <button class="btn-primary" onclick="verifyNid('${u._id}', 'verified')" style="padding:8px 16px;">✅ Verify</button>
                                <button class="btn-cancel" onclick="verifyNid('${u._id}', 'rejected')">❌ Reject</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } else { nidList.innerHTML = '<p style="text-align:center;padding:40px;">No NID submissions</p>'; }

        } catch (error) { console.error(error); }
    }

    // Check if Redirect from Dropdown
    window.addEventListener('DOMContentLoaded', () => {
        loadAdminDashboard();
        const dropdownTarget = localStorage.getItem('dropdownTarget');
        if (dropdownTarget) {
            localStorage.removeItem('dropdownTarget');
            showDetailSection(dropdownTarget);
        }
    });

    // Show Detail Section from Dropdown
    async function showDetailSection(type) {
        const token = localStorage.getItem('token');
        if (!token) return;

        // Hide all tabs
        document.querySelectorAll('.admin-tabs, .admin-content').forEach(c => c.classList.add('hidden'));

        if (type === 'user-details') {
            document.getElementById('detailedUserSection').classList.remove('hidden');
            const res = await fetch(`${API}/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            const list = document.getElementById('detailedUserList');
            if (data.success) {
                const usersOnly = data.users.filter(u => u.role === 'user');
                list.innerHTML = usersOnly.map(u => `
                    <div class="booking-item" style="flex-direction:column; align-items:stretch;">
                        <h3>${u.name}</h3>
                        <p><i class="fas fa-envelope"></i> ${u.email}</p>
                        <p><i class="fas fa-phone"></i> ${u.phone || 'N/A'}</p>
                        <p><i class="fas fa-map-marker-alt"></i> ${u.address || 'N/A'}</p>
                        <p><i class="fas fa-check-circle"></i> Verified: ${u.isVerified ? 'Yes' : 'No'}</p>
                    </div>
                `).join('');
            }
        } else if (type === 'provider-details') {
            document.getElementById('detailedProviderSection').classList.remove('hidden');
            const res = await fetch(`${API}/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            const list = document.getElementById('detailedProviderList');
            if (data.success) {
                const providersOnly = data.users.filter(u => u.role === 'provider');
                list.innerHTML = providersOnly.map(u => `
                    <div class="booking-item" style="flex-direction:column; align-items:stretch;">
                        <h3>${u.name}</h3>
                        <p><i class="fas fa-envelope"></i> ${u.email}</p>
                        <p><i class="fas fa-phone"></i> ${u.phone || 'N/A'}</p>
                        <p><i class="fas fa-map-marker-alt"></i> ${u.address || 'N/A'}</p>
                        <p><i class="fas fa-id-card"></i> NID: ${u.nidNumber || 'Not Submitted'}</p>
                        <p>NID Status: <span style="color:${u.nidStatus === 'verified' ? '#067647' : '#92400e'}; font-weight:600;">${(u.nidStatus || 'not_submitted').toUpperCase()}</span></p>
                    </div>
                `).join('');
            }
        }
    }

    // Tab Switching (Restore visibility)
    function showTab(tab, btn) {
        document.querySelectorAll('.admin-tabs, .admin-content').forEach(c => c.classList.remove('hidden'));
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-content').forEach(c => c.classList.add('hidden'));
        
        document.getElementById(`${tab}Tab`).classList.remove('hidden');
        btn.classList.add('active');
        document.getElementById('detailedUserSection').classList.add('hidden');
        document.getElementById('detailedProviderSection').classList.add('hidden');
    }

    // Delete User & Verify NID functions
    async function deleteUser(id) {
        if (!confirm('Delete this user?')) return;
        const token = localStorage.getItem('token');
        await fetch(`${API}/admin/users/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        alert('User Deleted!');
        location.reload();
    }

    async function verifyNid(userId, status) {
        const token = localStorage.getItem('token');
        await fetch(`${API}/nid/verify/${userId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ status })
        });
        alert('NID Status Updated!');
        location.reload();
    }
</script>
</body>
</html>
