<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links" id="navLinks">
            
        </div>
        <div class="nav-actions" id="navAuth">
            
        </div>
    </nav>

    <!-- Main Content Area -->
    <div id="adminMainContent" style="margin-top: 40px;">
        <h1 class="section-title">Admin Dashboard</h1>
        <p class="section-sub">Manage all aspects of FixMate</p>

        <!-- Tabs -->
        <div class="admin-tabs" id="adminTabs">
            <button class="admin-tab active" onclick="showTab('users', this)">All Users</button>
            <button class="admin-tab" onclick="showTab('services', this)">All Services</button>
            <button class="admin-tab" onclick="showTab('nid', this)">NID Verify</button>
        </div>

        <div id="usersTab" class="admin-content"></div>
        <div id="servicesTab" class="admin-content hidden"></div>
        <div id="nidTab" class="admin-content hidden"></div>
    </div>

    <!-- Detailed View Area  -->
    <div id="detailViewArea" class="hidden" style="margin-top: 40px;">
        <div id="detailContent"></div>
    </div>

</div>

<script src="js/main.js"></script>
<script>
    let allData = { users: [], providers: [], services: [], bookings: [], reviews: [] };

    
    async function fetchAdminData() {
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; return; }

        try {
            const res = await fetch(`${API}/admin/details`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) {
                allData = data;
                renderUsersTab();
                renderServicesTab();
                renderNidTab();
            }
        } catch (error) {
            console.error('Error loading admin data:', error);
        }
    }

    
    function renderUsersTab() {
        const list = document.getElementById('usersTab');
        if (allData.users.length === 0) { list.innerHTML = '<p>No users found</p>'; return; }
        list.innerHTML = allData.users.map(u => `
            <div class="booking-item" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h3>${u.name}</h3>
                    <p><i class="fas fa-envelope"></i> ${u.email}</p>
                </div>
                <button class="btn-cancel" onclick="deleteUser('${u._id}')">Delete</button>
            </div>
        `).join('');
    }

    function renderServicesTab() {
        const list = document.getElementById('servicesTab');
        if (allData.services.length === 0) { list.innerHTML = '<p>No services found</p>'; return; }
        list.innerHTML = allData.services.map(s => `
            <div class="booking-item">
                <h3>${s.title}</h3>
                <p><i class="fas fa-tag"></i> ৳${s.price}</p>
                <p><i class="fas fa-user"></i> Provider: ${s.providerId?.name || 'N/A'}</p>
            </div>
        `).join('');
    }

    function renderNidTab() {
        const list = document.getElementById('nidTab');
        const pendingNids = allData.providers.filter(p => p.nidStatus === 'pending');
        if (pendingNids.length === 0) { list.innerHTML = '<p>No pending NID verifications</p>'; return; }
        list.innerHTML = pendingNids.map(p => `
            <div class="booking-item" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h3>${p.name}</h3>
                    <p><i class="fas fa-id-card"></i> NID: ${p.nidNumber}</p>
                </div>
                <div>
                    <button class="btn-primary" onclick="verifyNid('${p._id}', 'verified')" style="margin-right:8px;">Verify</button>
                    <button class="btn-cancel" onclick="verifyNid('${p._id}', 'rejected')">Reject</button>
                </div>
            </div>
        `).join('');
    }

    
    function showTab(tab, btn) {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-content').forEach(c => c.classList.add('hidden'));
        btn.classList.add('active');
        document.getElementById(`${tab}Tab`).classList.remove('hidden');
        
        
        document.getElementById('detailViewArea').classList.add('hidden');
        document.getElementById('adminMainContent').classList.remove('hidden');
    }

    
    function showAdminSection(type) {
        
        document.getElementById('adminMainContent').classList.add('hidden');
        const detailArea = document.getElementById('detailViewArea');
        const content = document.getElementById('detailContent');
        detailArea.classList.remove('hidden');

        if (type === 'user') {
            content.innerHTML = `<h2 class="section-title" style="margin-bottom:20px;">User Details</h2>` + 
            allData.users.map(u => {
                
                const userBookings = allData.bookings.filter(b => b.userId?._id === u._id);
                
                const userReviews = allData.reviews.filter(r => r.userId?._id === u._id);
                
                return `
                <div class="booking-item" style="flex-direction:column; align-items:stretch; margin-bottom:20px;">
                    <h3>${u.name} (${u.email})</h3>
                    
                    <div style="margin-top:12px; padding:12px; background:#f9fafb; border-radius:8px;">
                        <h4 style="color:#0b1a33; margin-bottom:8px;">Bookings (${userBookings.length})</h4>
                        ${userBookings.length > 0 ? userBookings.map(b => `
                            <p style="font-size:0.9rem; color:#475467;">
                                • Service: ${b.serviceId?.title} | Status: <strong>${b.status}</strong>
                            </p>
                        `).join('') : '<p style="font-size:0.9rem; color:#98a2b3;">No bookings yet</p>'}
                    </div>

                    <div style="margin-top:12px; padding:12px; background:#f9fafb; border-radius:8px;">
                        <h4 style="color:#0b1a33; margin-bottom:8px;">Reviews (${userReviews.length})</h4>
                        ${userReviews.length > 0 ? userReviews.map(r => `
                            <p style="font-size:0.9rem; color:#475467;">
                                • Rating: ${r.rating} ★ | Service: ${r.serviceId?.title}
                            </p>
                        `).join('') : '<p style="font-size:0.9rem; color:#98a2b3;">No reviews yet</p>'}
                    </div>
                </div>
                `;
            }).join('');
        } 
        else if (type === 'provider') {
            content.innerHTML = `<h2 class="section-title" style="margin-bottom:20px;">Provider Details</h2>` + 
            allData.providers.map(p => {
                
                const providerServices = allData.services.filter(s => s.providerId?._id === p._id);
                
                const providerReviews = allData.reviews.filter(r => r.serviceId && allData.services.find(s => s._id === r.serviceId && s.providerId === p._id));

                return `
                <div class="booking-item" style="flex-direction:column; align-items:stretch; margin-bottom:20px;">
                    <h3>${p.name} (${p.email})</h3>
                    
                    <div style="margin-top:12px; padding:12px; background:#f9fafb; border-radius:8px;">
                        <h4 style="color:#0b1a33; margin-bottom:8px;">Services (${providerServices.length})</h4>
                        ${providerServices.length > 0 ? providerServices.map(s => `
                            <p style="font-size:0.9rem; color:#475467;">
                                • ${s.title} | Price: ৳${s.price}
                            </p>
                        `).join('') : '<p style="font-size:0.9rem; color:#98a2b3;">No services yet</p>'}
                    </div>

                    <div style="margin-top:12px; padding:12px; background:#f9fafb; border-radius:8px;">
                        <h4 style="color:#0b1a33; margin-bottom:8px;">NID Status</h4>
                        <p style="font-size:0.9rem; color:#475467;">
                            NID Number: ${p.nidNumber || 'Not submitted'} <br>
                            Status: <strong>${(p.nidStatus || 'not_submitted').toUpperCase()}</strong>
                        </p>
                    </div>

                    <div style="margin-top:12px; padding:12px; background:#f9fafb; border-radius:8px;">
                        <h4 style="color:#0b1a33; margin-bottom:8px;">Reviews (${providerReviews.length})</h4>
                        ${providerReviews.length > 0 ? providerReviews.map(r => `
                            <p style="font-size:0.9rem; color:#475467;">
                                • Rating: ${r.rating} ★ | By: ${r.userId?.name}
                            </p>
                        `).join('') : '<p style="font-size:0.9rem; color:#98a2b3;">No reviews yet</p>'}
                    </div>
                </div>
                `;
            }).join('');
        }
    }

    
    async function deleteUser(id) {
        if (!confirm('Delete this user?')) return;
        const token = localStorage.getItem('token');
        await fetch(`${API}/admin/users/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        alert('User deleted!'); location.reload();
    }

    async function verifyNid(userId, status) {
        const token = localStorage.getItem('token');
        await fetch(`${API}/nid/verify/${userId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ status })
        });
        alert(`NID ${status}!`); location.reload();
    }

    
    window.addEventListener('DOMContentLoaded', () => {
        fetchAdminData();
        const dropdownTarget = localStorage.getItem('dropdownTarget');
        if (dropdownTarget) {
            localStorage.removeItem('dropdownTarget');
            showAdminSection(dropdownTarget);
        }
    });
</script>
</body>
</html>
