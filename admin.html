<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html">Admin</a>
        </div>
        <div class="nav-actions">
            <button class="btn-outline" onclick="logout()">Log Out</button>
        </div>
    </nav>

    <h1 class="section-title" style="margin-top:40px;">Admin Panel</h1>
    <p class="section-sub">Manage Users, Services, and NID Verification</p>

    <div class="admin-tabs">
        <button class="admin-tab active" onclick="showTab('users')">Users</button>
        <button class="admin-tab" onclick="showTab('services')">Services</button>
        <button class="admin-tab" onclick="showTab('nid')">NID Verify</button>
    </div>

    <div id="usersTab" class="admin-content">
        <div id="usersList"></div>
    </div>

    <div id="servicesTab" class="admin-content hidden">
        <div id="servicesList"></div>
    </div>

    <div id="nidTab" class="admin-content hidden">
        <div id="nidList"></div>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    async function loadAdminDashboard() {
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; return; }

        try {
            // Users
            const usersRes = await fetch(`${API}/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            const usersData = await usersRes.json();
            const usersList = document.getElementById('usersList');
            if (usersData.success && usersData.users.length > 0) {
                usersList.innerHTML = usersData.users.map(u => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <h3>${u.name}</h3>
                            <p><i class="fas fa-envelope"></i> ${u.email}</p>
                            <p><i class="fas fa-user-tag"></i> ${u.role}</p>
                        </div>
                        <div class="booking-status">
                            <button class="btn-cancel" onclick="deleteUser('${u._id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } else {
                usersList.innerHTML = '<p style="text-align:center;padding:40px;">No users found</p>';
            }

            // Services
            const servicesRes = await fetch(`${API}/admin/services`, { headers: { 'Authorization': `Bearer ${token}` } });
            const servicesData = await servicesRes.json();
            const servicesList = document.getElementById('servicesList');
            if (servicesData.success && servicesData.services.length > 0) {
                servicesList.innerHTML = servicesData.services.map(s => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <h3>${s.title}</h3>
                            <p><i class="fas fa-tag"></i> ৳${s.price}</p>
                            <p><i class="fas fa-user"></i> ${s.providerId?.name || 'N/A'}</p>
                        </div>
                    </div>
                `).join('');
            } else {
                servicesList.innerHTML = '<p style="text-align:center;padding:40px;">No services found</p>';
            }

            // NID List
            const nidRes = await fetch(`${API}/admin/nid-list`, { headers: { 'Authorization': `Bearer ${token}` } });
            const nidData = await nidRes.json();
            const nidList = document.getElementById('nidList');
            if (nidData.success && nidData.users.length > 0) {
                nidList.innerHTML = nidData.users.map(u => `
                    <div class="booking-item" style="flex-direction:column; align-items:stretch; padding:24px;">
                        <h3>${u.name}</h3>
                        <p><i class="fas fa-id-card"></i> NID: ${u.nidNumber || 'Not Submitted'}</p>
                        <p>Status: <span style="color:${u.nidStatus === 'verified' ? '#067647' : '#92400e'}; font-weight:600;">${(u.nidStatus || 'not_submitted').toUpperCase()}</span></p>
                        <div style="display:flex; gap:12px; margin-top:12px;">
                            ${u.nidStatus === 'pending' ? `
                                <button class="btn-primary" onclick="verifyNid('${u._id}', 'verified')" style="padding:8px 16px;">✅ Verify</button>
                                <button class="btn-cancel" onclick="verifyNid('${u._id}', 'rejected')">❌ Reject</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } else {
                nidList.innerHTML = '<p style="text-align:center;padding:40px;">No NID submissions</p>';
            }
        } catch (error) { console.error(error); }
    }

    async function verifyNid(userId, status) {
        const token = localStorage.getItem('token');
        const res = await fetch(`${API}/nid/verify/${userId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ status })
        });
        if (res.ok) { alert('NID Status Updated!'); location.reload(); }
    }

    async function deleteUser(id) {
        if (!confirm('Delete this user?')) return;
        const token = localStorage.getItem('token');
        const res = await fetch(`${API}/admin/users/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) { alert('User Deleted!'); location.reload(); }
    }

    function showTab(tab) {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(`${tab}Tab`).classList.remove('hidden');
        event.target.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', loadAdminDashboard);
</script>
</body>
</html>
