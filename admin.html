<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel · FixMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Fix<span>Mate</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="my-bookings.html">My Bookings</a>
            <a href="profile.html">Profile</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="nav-actions" id="navAuth">
            <button class="btn-outline" onclick="openModal('signin')">Log In</button>
            <button class="btn-primary" onclick="openModal('signup')">Sign Up</button>
        </div>
    </nav>

    <!-- ADMIN LOGIN FORM -->
    <div id="adminLoginSection">
        <h1 class="section-title" style="margin-top:40px;">Admin Login</h1>
        <p class="section-sub">Enter admin credentials to access the panel</p>

        <div class="profile-card" style="max-width:400px;">
            <form onsubmit="adminLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" value="admin@fixmate.com" readonly style="background:#f1f4f9;" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" value="admin123" readonly style="background:#f1f4f9;" />
                </div>
                <button type="submit" class="btn-full">Login as Admin</button>
            </form>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanelSection" style="display:none;">
        <h1 class="section-title" style="margin-top:40px;">Admin Panel</h1>
        <p class="section-sub">Manage Users & Services</p>

        <!-- Statistics -->
        <div class="stats-row">
            <div class="stat-item"><div class="stat-number" id="totalUsers">0</div><div class="stat-label">Total Users</div></div>
            <div class="stat-item"><div class="stat-number" id="totalProviders">0</div><div class="stat-label">Providers</div></div>
            <div class="stat-item"><div class="stat-number" id="totalServices">0</div><div class="stat-label">Services</div></div>
            <div class="stat-item"><div class="stat-number" id="totalBookings">0</div><div class="stat-label">Bookings</div></div>
        </div>

        <!-- Tabs -->
        <div class="admin-tabs">
            <button class="admin-tab active" onclick="showTab('users')">Users</button>
            <button class="admin-tab" onclick="showTab('services')">Services</button>
        </div>

        <!-- Users Tab -->
        <div id="usersTab" class="admin-content">
            <div id="usersList"></div>
        </div>

        <!-- Services Tab -->
        <div id="servicesTab" class="admin-content hidden">
            <div id="servicesList"></div>
        </div>
    </div>

    <footer>
        <div>© 2026 FixMate · All rights reserved.</div>
        <div class="footer-links">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="logo-sm">Fix<span>Mate</span></div>
        <div class="subtitle" id="modalSubtitle">Sign in to your account</div>
        <div id="modalMessage" class="message-box"></div>
        <div class="tabs">
            <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
        </div>
        <form id="signinForm" class="form" onsubmit="handleSignIn(event)">
            <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required /></div>
            <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required /></div>
            <button type="submit" class="btn-full">Sign In</button>
        </form>
        <form id="signupForm" class="form hidden" onsubmit="handleSignUp(event)">
            <div class="form-group"><label>Full Name</label><input type="text" id="signupName" required /></div>
            <div class="form-group"><label>Email</label><input type="email" id="signupEmail" required /></div>
            <div class="form-group"><label>Password</label><input type="password" id="signupPassword" required /></div>
            <button type="submit" class="btn-full">Create Account</button>
        </form>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    // ===== Admin Login =====
    async function adminLogin(e) {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;

        try {
            const res = await fetch(`${API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (data.success && data.user.role === 'admin') {
                localStorage.setItem('adminToken', data.token);
                showToast('✅ Admin Login successful!', 'success');
                document.getElementById('adminLoginSection').style.display = 'none';
                document.getElementById('adminPanelSection').style.display = 'block';
                loadAdminDashboard();
            } else {
                showToast('❌ Invalid admin credentials', 'error');
            }
        } catch (error) {
            showToast('❌ Server error', 'error');
        }
    }

    // ===== Load Admin Dashboard =====
    async function loadAdminDashboard() {
        const token = localStorage.getItem('adminToken');
        if (!token) {
            document.getElementById('adminLoginSection').style.display = 'block';
            document.getElementById('adminPanelSection').style.display = 'none';
            return;
        }

        try {
            // Statistics
            const statsRes = await fetch(`${API}/admin/stats`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const statsData = await statsRes.json();

            if (statsData.success) {
                document.getElementById('totalUsers').textContent = statsData.statistics.totalUsers;
                document.getElementById('totalProviders').textContent = statsData.statistics.totalProviders;
                document.getElementById('totalServices').textContent = statsData.statistics.totalServices;
                document.getElementById('totalBookings').textContent = statsData.statistics.totalBookings;
            }

            // Users
            const usersRes = await fetch(`${API}/admin/users`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const usersData = await usersRes.json();

            const usersList = document.getElementById('usersList');
            if (usersData.success && usersData.users.length > 0) {
                usersList.innerHTML = usersData.users.map(u => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <h3>${u.name}</h3>
                            <p><i class="fas fa-envelope"></i> ${u.email}</p>
                            <p><i class="fas fa-user-tag"></i> ${u.role}</p>
                        </div>
                        <div class="booking-status">
                            <button class="btn-cancel" onclick="deleteUser('${u._id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } else {
                usersList.innerHTML = '<p style="text-align:center;padding:40px;color:#98a2b3;">No users found</p>';
            }

            // Services
            const servicesRes = await fetch(`${API}/admin/services`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const servicesData = await servicesRes.json();

            const servicesList = document.getElementById('servicesList');
            if (servicesData.success && servicesData.services.length > 0) {
                servicesList.innerHTML = servicesData.services.map(s => `
                    <div class="booking-item">
                        <div class="booking-info">
                            <h3>${s.title}</h3>
                            <p><i class="fas fa-tag"></i> ৳${s.price}</p>
                            <p><i class="fas fa-user"></i> ${s.providerId?.name || 'N/A'}</p>
                            <p><i class="fas fa-info-circle"></i> ${s.status}</p>
                        </div>
                    </div>
                `).join('');
            } else {
                servicesList.innerHTML = '<p style="text-align:center;padding:40px;color:#98a2b3;">No services found</p>';
            }

        } catch (error) {
            console.log('Error:', error.message);
        }
    }

    // ===== Delete User =====
    async function deleteUser(id) {
        if (!confirm('Are you sure you want to delete this user?')) return;
        const token = localStorage.getItem('adminToken');
        try {
            const res = await fetch(`${API}/admin/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) {
                showToast('✅ User deleted successfully', 'success');
                loadAdminDashboard();
            }
        } catch (error) {
            showToast('❌ Error deleting user', 'error');
        }
    }

    // ===== Show Tab =====
    function showTab(tab) {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-content').forEach(c => c.classList.add('hidden'));

        if (tab === 'users') {
            document.getElementById('usersTab').classList.remove('hidden');
            document.querySelectorAll('.admin-tab')[0].classList.add('active');
        } else if (tab === 'services') {
            document.getElementById('servicesTab').classList.remove('hidden');
            document.querySelectorAll('.admin-tab')[1].classList.add('active');
        }
    }

    // ===== Load on Page Start =====
    window.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('adminToken');
        if (token) {
            document.getElementById('adminLoginSection').style.display = 'none';
            document.getElementById('adminPanelSection').style.display = 'block';
            loadAdminDashboard();
        }
    });
</script>
</body>
</html>
